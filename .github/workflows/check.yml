name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: npm run lint:extension
      - run: npm run release
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
      - name: Check minimum companion runtime
        run: npx tsx --test tests/install.test.mjs tests/native.test.ts tests/t3.test.ts
      - uses: actions/upload-artifact@v7
        with:
          name: Prompt2Scroll-preview-${{ matrix.os }}
          path: |
            dist/releases/*/Prompt2Scroll-*.zip
            dist/releases/*/Prompt2Scroll-*.sha256
